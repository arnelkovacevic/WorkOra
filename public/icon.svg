<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="wo-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="60%" stop-color="#4338CA" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>
    <linearGradient id="wo-w-white" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#EEF2FF" />
    </linearGradient>
    <filter id="wo-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#1e1b4b" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Pozadina sa zaobljenim uglovima (iOS/Android PWA stil) -->
  <rect width="512" height="512" rx="112" fill="url(#wo-bg)" />

  <!-- Suptilni vanjski prsten -->
  <rect x="20" y="20" width="472" height="472" rx="98" fill="none" stroke="white" stroke-opacity="0.15" stroke-width="4" />

  <!-- Glavna kompozicija: W + Ora (Sat) -->
  <g filter="url(#wo-shadow)">
    <!-- Kružni oreol sata sa isprekidanim oznakama -->
    <circle
      cx="256"
      cy="256"
      r="176"
      fill="none"
      stroke="white"
      stroke-opacity="0.25"
      stroke-width="10"
      stroke-dasharray="14 12"
    />

    <!-- Oznake glavnih sati: 12, 3, 6, 9 -->
    <circle cx="256" cy="98" r="8" fill="#FDE047" />
    <circle cx="414" cy="256" r="6" fill="white" fill-opacity="0.7" />
    <circle cx="256" cy="414" r="6" fill="white" fill-opacity="0.7" />
    <circle cx="98" cy="256" r="6" fill="white" fill-opacity="0.7" />

    <!-- Stilizovano slovo W -->
    <path
      d="M136 200 L196 350 L256 250 L316 350 L376 200"
      fill="none"
      stroke="url(#wo-w-white)"
      stroke-width="32"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Kazaljke sata koje izviru iz centralne tačke W (256, 250) -->
    <!-- Minutna kazaljka (žuta / zlato, usmjerena prema 2 sata) -->
    <path
      d="M256 250 L330 166"
      fill="none"
      stroke="#FDE047"
      stroke-width="16"
      stroke-linecap="round"
    />

    <!-- Satna kazaljka (bijela, usmjerena prema 10 sati) -->
    <path
      d="M256 250 L194 188"
      fill="none"
      stroke="#FFFFFF"
      stroke-width="16"
      stroke-linecap="round"
    />

    <!-- Centralna osovina sata -->
    <circle cx="256" cy="250" r="18" fill="#FBBF24" />
    <circle cx="256" cy="250" r="8" fill="#1E1B4B" />
  </g>
</svg>
